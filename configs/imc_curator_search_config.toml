[archives]
extensions = [".zip"]

[categories.images]
extensions = [".tif", ".tiff"]
strong_positive_keywords = ["full", "stack"]
weak_positive_keywords = ["ROI"]
negative_keywords = ["mask", "exclucion", ".pdf", ".csv"]
destination = "data/processed/images"

[categories.marker_metadata]
extensions = [".csv", ".tsv", ".xls", ".xlsx"]
strong_positive_keywords = ["marker", "panel", "channel"]
weak_positive_keywords = []
negative_keywords = ["clinical", "patient", "donor"]
destination = "metadata/markers"

[categories.clinical_data]
extensions = [".csv", ".docx", ".pdf", ".xls", ".xlsx"]
strong_positive_keywords = ["clinical", "patient", "donor"]
weak_positive_keywords = ["cli"]
negative_keywords = ["marker", "channel", "antibody"]
destination = "metadata/clinical"

[categories.raw_imc_data]
extensions = [".mcd", ".txt"]
strong_positive_keywords = ["TMA", ".mcd"]
weak_positive_keywords = []
negative_keywords = []
destination = "metadata/raw_imc_data"